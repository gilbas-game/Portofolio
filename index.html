<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensaKu | Portfolio Fotografi</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body>

  <header>
    <div class="header-container" id="header-container">
      <!-- JS: logo + nav + menu toggle -->
    </div>
  </header>

  <section id="home" class="hero">
    <div class="hero-overlay">
      <div class="hero-content" id="hero-content">
        <!-- JS: hero title + subtitle + button -->
      </div>
    </div>
  </section>

  <section id="about" class="section-dark">
    <div class="container">
      <h2 class="section-title" id="about-title"></h2>
      <div class="about-content" id="about-content">
        <!-- JS: image + bio + stats + specializations -->
      </div>
    </div>
  </section>

  <section id="portfolio" class="section-light">
    <div class="container">
      <h2 class="section-title" id="portfolio-title"></h2>
      <p class="section-subtitle" id="portfolio-subtitle"></p>
      <div class="portfolio-filters" id="portfolio-filters">
        <!-- JS: filter buttons -->
      </div>
      <div class="portfolio-grid" id="portfolio-grid">
        <!-- JS: portfolio items -->
      </div>
    </div>
  </section>

  <section id="services" class="section-dark">
    <div class="container">
      <h2 class="section-title" id="services-title"></h2>
      <p class="section-subtitle" id="services-subtitle"></p>
      <div class="services-grid" id="services-grid">
        <!-- JS: service cards -->
      </div>
    </div>
  </section>

  <section id="contact" class="section-light">
    <div class="container">
      <h2 class="section-title" id="contact-title"></h2>
      <p class="section-subtitle" id="contact-subtitle"></p>
      <div class="contact-container" id="contact-container">
        <!-- JS: contact header + cards + info boxes + CTA -->
      </div>
    </div>
  </section>

  <footer id="footer">
    <div class="container">
      <div class="footer-content" id="footer-content">
        <!-- JS: footer content -->
      </div>
      <div class="copyright" id="copyright">
        <!-- JS: copyright -->
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
