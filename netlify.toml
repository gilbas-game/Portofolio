[build]
  publish = "."
  command = ""

# Redirect admin/ ke admin/index.html (SPA fallback)
[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

# Headers untuk CMS (disable caching pada admin)
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
