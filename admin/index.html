<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LensaKu - Admin Panel</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <style>
      body { margin: 0; background: #0a192f; }
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
        color: #64ffda;
        font-size: 18px;
      }
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #1e3a5f;
        border-top-color: #64ffda;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>Memuat CMS LensaKu...</div>
    </div>
    <!-- Netlify Identity Widget (wajib untuk login CMS) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.6.5/dist/decap-cms.js"></script>
    <script>
      // Sembunyikan loading setelah CMS siap
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function() {
          var loading = document.getElementById('loading');
          if (loading) loading.style.display = 'none';
        });
      }
      // Fallback: sembunyikan loading setelah 8 detik maksimal
      setTimeout(function() {
        var loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
      }, 8000);
    </script>
  </body>
</html>
